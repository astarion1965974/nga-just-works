name: Verify ColorOS 17 Build

on:
  push:
    branches: [coui-preview]
    paths:
      - .github/workflows/coui-preview.yml
      - 'nga_phone_base_3.0/src/main/**'
      - 'lib_base_ui_compose/src/main/**'

concurrency:
  group: coloros-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.repository == 'astarion1965974/nga-just-works' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 17 SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Build signed ARM64 preview
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export ANDROID_SIGNING_STORE_FILE="$RUNNER_TEMP/nga-coloros-preview.p12"
          export ANDROID_SIGNING_STORE_PASSWORD="$(openssl rand -hex 32)"
          export ANDROID_SIGNING_KEY_ALIAS=nga-coloros
          export ANDROID_SIGNING_KEY_PASSWORD="$ANDROID_SIGNING_STORE_PASSWORD"
          echo "::add-mask::$ANDROID_SIGNING_STORE_PASSWORD"
          keytool -genkeypair -alias "$ANDROID_SIGNING_KEY_ALIAS" -keyalg RSA -keysize 3072 -validity 10000 \
            -storetype PKCS12 -keystore "$ANDROID_SIGNING_STORE_FILE" \
            -storepass:env ANDROID_SIGNING_STORE_PASSWORD -dname 'CN=NGA Just Works ColorOS Preview'
          ./gradlew :nga_phone_base_3.0:assembleRelease -x :nga_phone_base_3.0:lintVitalRelease \
            --no-daemon --console=plain --max-workers=3
      - name: Verify release package
        shell: bash
        run: |
          set -euo pipefail
          src_dir=nga_phone_base_3.0/build/outputs/apk/release
          test "$(find "$src_dir" -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' | wc -l)" = 1
          apk=NGA-Just-Works-COUI-build-$GITHUB_RUN_NUMBER-arm64.apk
          mkdir -p dist
          cp "$(find "$src_dir" -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' -print -quit)" "dist/$apk"
          tools="$ANDROID_HOME/build-tools/37.0.0"
          "$tools/aapt" dump badging "dist/$apk" > "$RUNNER_TEMP/nga-apk-info"
          grep -F "package: name='com.astarion.ngajustworks.coui' versionCode='4051' versionName='4.5.1'" "$RUNNER_TEMP/nga-apk-info"
          grep -Fx "sdkVersion:'37'" "$RUNNER_TEMP/nga-apk-info"
          grep -Fx "targetSdkVersion:'37'" "$RUNNER_TEMP/nga-apk-info"
          grep -Fx "native-code: 'arm64-v8a'" "$RUNNER_TEMP/nga-apk-info"
          if grep -q '^application-debuggable' "$RUNNER_TEMP/nga-apk-info"; then exit 1; fi
          "$tools/apksigner" verify --verbose --print-certs "dist/$apk"
          (cd dist && sha256sum "$apk" > "$apk.sha256" && sha256sum -c "$apk.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: nga-coloros17-arm64
          path: dist/
          if-no-files-found: error
          retention-days: 14
